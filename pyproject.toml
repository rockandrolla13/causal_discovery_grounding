[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "naturalness"
version = "0.1.0"
description = "Naturalness grounding: bounds on target-site CATEs from multi-site trials and observational data"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
# What `import causal_grounding` needs. The TabICLv2 backend (torch, tabicl),
# Experiment III (jax, numpyro) and the comparators are in requirements.txt.
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "scipy>=1.11",
    "scikit-learn>=1.3",
]

[tool.setuptools.packages.find]
include = ["causal_grounding", "causal_grounding.*"]

[tool.pytest.ini_options]
testpaths = ["tests", "ManyLabs1/pre-process"]

# Lint: pyflakes and pycodestyle errors (ruff's defaults). E402 is ignored
# until the sys.path inserts in the experiment scripts are removed.
[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E402"]
