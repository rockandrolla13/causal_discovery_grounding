name: Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# A second push to the same PR supersedes the first; don't spend 30 minutes on a stale commit.
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Advisory until the existing findings (42 at the time of writing) are fixed.
      # Flip continue-on-error to false once `ruff check .` is clean.
      - name: ruff check
        continue-on-error: true
        run: |
          python -m pip install ruff
          ruff check --output-format=github .

  pytest:
    name: pytest (Python 3.11, CPU)
    runs-on: ubuntu-latest
    # The suite takes about 25 minutes on a 16-thread machine, plus dependency install.
    timeout-minutes: 60

    env:
      MPLBACKEND: Agg
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      # tabicl downloads its checkpoint here on first use; the cache step keeps it.
      HF_HOME: ${{ github.workspace }}/.hf-cache

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt

      # Same order as the Dockerfile: torch from the PyTorch index first, or pip
      # resolves the default (CUDA) PyPI wheel.
      - name: Install torch (CPU)
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.5.1+cpu

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Cache the TabICL checkpoint
        uses: actions/cache@v4
        with:
          path: .hf-cache
          key: hf-tabicl-${{ hashFiles('requirements.txt') }}

      - name: Show installed packages
        run: python -m pip list

      - name: Run test suite
        run: |
          python -m pytest \
            -ra \
            --tb=short \
            --durations=15 \
            --continue-on-collection-errors \
            --junitxml=pytest-report.xml

      - name: Summarise failures
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import pathlib
          import xml.etree.ElementTree as ET

          report = pathlib.Path("pytest-report.xml")
          if not report.exists():
              print("## Tests\n\nNo pytest report was produced: the run failed before tests started.")
              raise SystemExit(0)

          root = ET.parse(report).getroot()
          suites = root.findall("testsuite") or [root]
          totals = {"tests": 0, "failures": 0, "errors": 0, "skipped": 0}
          bad = []
          for suite in suites:
              for key in totals:
                  totals[key] += int(suite.get(key, 0))
              for case in suite.iter("testcase"):
                  for kind in ("failure", "error"):
                      node = case.find(kind)
                      if node is not None:
                          name = f"{case.get('classname', '')}::{case.get('name', '')}".strip(":")
                          bad.append((kind, name, (node.get("message") or "").splitlines()[:1]))

          print("## Test results\n")
          print(
              f"{totals['tests']} tests | {totals['failures']} failed | "
              f"{totals['errors']} errored | {totals['skipped']} skipped\n"
          )
          if bad:
              print("### Failures and errors\n")
              for kind, name, message in bad:
                  detail = message[0] if message else ""
                  print(f"- **{kind}** `{name}` {detail}")
          else:
              print("All collected tests passed.")
          PY

      - name: Upload pytest report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: pytest-report.xml
          if-no-files-found: ignore
